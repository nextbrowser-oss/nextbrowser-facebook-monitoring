name: Bug report
description: Report a reproducible problem with Facebook Groups monitoring.
title: "[Bug]: "
labels: ["needs triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Facebook Groups monitoring. Please give enough detail for someone else to reproduce the problem.

        Do not include API keys, cookies, session data, other people's names, or the text of posts from private groups. Report security vulnerabilities through [private security reporting](https://github.com/nextbrowser-oss/nextbrowser-facebook-monitoring/security/advisories/new).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reading a group's posts (www.facebook.com)
        - The m.facebook.com fallback
        - Comments under posts
        - New posts missed or announced twice
        - Keyword and mention matching or urgency triage
        - Sign-in, security check, temporary block or membership
        - CLI (facebook-monitor)
        - Integration in Nextbrowser
        - Documentation
        - Other or not sure
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run facebook-monitor once --profile ... --verbose
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "For example: v0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: What the page showed
      description: The gate, rendered and diag fields of the failing "page" log line, for example "rendered false, feeds 1, articles 0".
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Paste the relevant --verbose lines, with names, group names and post text removed if they are private.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find an open duplicate.
        - label: I removed credentials, cookies, and private content.
